name: 🏷️ Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: 🚀 Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: 🔍 Extraire la version de package.json
        id: get_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version détectée : $VERSION (Tag : v$VERSION)"

      - name: 🏷️ Créer la Release GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.TAG }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "ℹ️ La release $TAG existe déjà, mise à jour ou ignorée."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
            echo "🎉 Release $TAG créée avec succès !"
          fi
